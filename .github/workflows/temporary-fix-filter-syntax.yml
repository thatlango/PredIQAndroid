name: Temporary filter syntax correction
on:
  push:
    branches: [feat/account-alerts-push-parity]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/account-alerts-push-parity
      - name: Apply exact Kotlin correction
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/com/getprediq/app/PrediqAppV2.kt')
          text = path.read_text()
          old = 'ChoiceRowV2((listOf("") + state.filterOptions.sports).distinct(), sport) { if (it.isBlank()) "All" else it.replaceFirstChar(Char::uppercase) } { sport = it; competition = "" }'
          new = 'ChoiceRowV2((listOf("") + state.filterOptions.sports).distinct(), sport, { if (it.isBlank()) "All" else it.replaceFirstChar(Char::uppercase) }) { sport = it; competition = "" }'
          if old not in text:
              raise SystemExit('Expected syntax target not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit correction
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/getprediq/app/PrediqAppV2.kt
          git commit -m 'fix: compile sport filter choice row'
          git push origin HEAD:feat/account-alerts-push-parity
