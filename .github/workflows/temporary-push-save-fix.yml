name: Temporary push preference save correction
on:
  push:
    branches: [fix/push-provider-availability]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/push-provider-availability
      - name: Correct persisted push state
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/com/getprediq/app/PrediqAppV2.kt')
          text = path.read_text()
          old = '''                            repo.updateLeagueAlerts(selectedLeagues.sorted())\n                            vm.saveNotifications(local)\n                            if (local.pushEnabled) PushRegistrationCoordinator.sync(context.applicationContext)'''
          new = '''                            repo.updateLeagueAlerts(selectedLeagues.sorted())\n                            val safeNotifications = if (pushConfigured) local else local.copy(pushEnabled = false)\n                            vm.saveNotifications(safeNotifications)\n                            if (safeNotifications.pushEnabled) PushRegistrationCoordinator.sync(context.applicationContext)'''
          if old not in text:
              raise SystemExit('Expected notification save target not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit correction
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/getprediq/app/PrediqAppV2.kt
          git commit -m 'fix: persist push off when provider is unavailable'
          git push origin HEAD:fix/push-provider-availability
