name: Apply sprint 4 compile fix v2
on:
  push:
    branches:
      - uiux-sprint-4-intelligence-first
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: uiux-sprint-4-intelligence-first
          fetch-depth: 0
      - name: Apply compile fix
        shell: bash
        run: |
          set -euo pipefail
          if [ -f .sprint4-fix/compile.patch ]; then
            patch -p1 --forward < .sprint4-fix/compile.patch
            git diff --check
          fi
      - name: Commit cleaned fix
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .sprint4-fix
          rm -f .github/workflows/apply-sprint4-compile-fix.yml .github/workflows/apply-sprint4-compile-fix-v2.yml
          git config user.name "thatlago"
          git config user.email "88454247+thatlango@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "fix(ui): resolve sprint 4 compile issues"
            git push origin HEAD:uiux-sprint-4-intelligence-first
          fi
