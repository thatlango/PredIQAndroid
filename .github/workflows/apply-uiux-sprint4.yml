name: Apply PredIQ UIUX sprint 4
on:
  push:
    branches: [ uiux-sprint-4-intelligence-first ]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: uiux-sprint-4-intelligence-first
          fetch-depth: 0
      - name: Apply reviewed UI patch
        run: |
          cat .sprint4/part-*.patch > /tmp/sprint4.patch
          patch -p1 --forward < /tmp/sprint4.patch
          git diff --check
      - name: Commit product UX changes and remove sprint scaffolding
        run: |
          rm -rf .sprint4
          rm -f .github/workflows/uiux-source-export.yml .github/workflows/apply-uiux-sprint4.yml
          git config user.name "thatlago"
          git config user.email "88454247+thatlango@users.noreply.github.com"
          git add -A
          git commit -m "feat(ui): make PredIQ intelligence-first across core screens"
          git push origin HEAD:uiux-sprint-4-intelligence-first
