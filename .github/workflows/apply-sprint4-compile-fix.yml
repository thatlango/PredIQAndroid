name: Apply sprint 4 compile fix
on:
  push:
    branches: [ uiux-sprint-4-intelligence-first ]
permissions:
  contents: write
jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'fix(ui): resolve sprint 4 compile issues') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: uiux-sprint-4-intelligence-first
      - name: Apply fix
        run: |
          patch -p1 --forward < .sprint4-fix/compile.patch
          git diff --check
      - name: Commit and clean scaffolding
        run: |
          rm -rf .sprint4-fix
          rm -f .github/workflows/apply-sprint4-compile-fix.yml
          git config user.name "thatlago"
          git config user.email "88454247+thatlango@users.noreply.github.com"
          git add -A
          git commit -m "fix(ui): resolve sprint 4 compile issues"
          git push origin HEAD:uiux-sprint-4-intelligence-first
