name: PredIQ Android Release

on:
  workflow_dispatch:
  push:
    tags: ['prediq-v*']

permissions:
  contents: read

jobs:
  signed-release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android release tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore upload keystore
        env:
          KEYSTORE_B64: ${{ secrets.PREDIQ_ANDROID_KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > prediq-upload-key.jks

      - name: Build signed APK and AAB
        env:
          PREDIQ_ANDROID_KEYSTORE_FILE: ${{ github.workspace }}/prediq-upload-key.jks
          PREDIQ_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.PREDIQ_ANDROID_KEYSTORE_PASSWORD }}
          PREDIQ_ANDROID_KEY_ALIAS: ${{ secrets.PREDIQ_ANDROID_KEY_ALIAS }}
          PREDIQ_ANDROID_KEY_PASSWORD: ${{ secrets.PREDIQ_ANDROID_KEY_PASSWORD }}
        run: gradle :app:lintVitalRelease :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Verify APK signature
        run: "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: prediq-signed-release
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
